[project]
name = "sphereye-api"
version = "0.1.0"
description = "SPHEREye — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "astropy>=8.0.2",
    "reproject>=0.21.0",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "httpx>=0.28.1",
    "scipy>=1.18.1",
    "boto3>=1.36",
    "cachetools",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "respx>=0.23.1",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "moto[s3]",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live and not live_storage'"
markers = [
    "live: hits the real IRSA",
    "live_storage: hits the real S3-compatible bucket",
]
